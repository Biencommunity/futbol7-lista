<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 24px auto;
    padding: 0 16px;
  }
  h1 { font-size: 1.3em; color: #1f8a3b; margin-bottom: 4px; }
  .subtitle { opacity: 0.7; margin-top: 0; margin-bottom: 20px; font-size: 0.9em; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid #1f8a3b;
  }
  .match-info { display: flex; flex-direction: column; }
  .match-date { font-weight: 700; font-size: 1.1em; }
  .notes { font-size: 0.85em; opacity: 0.75; }
  .count {
    font-weight: 600;
    background: #1f8a3b;
    color: #fff;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.85em;
  }
  .list {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (max-width: 480px) {
    .list { grid-template-columns: 1fr; }
  }
  .slot {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 8px 10px;
  }
  .slot-num {
    width: 22px; height: 22px; flex: none;
    border-radius: 50%;
    background: #eee; color: #555;
    font-size: 0.75em;
    display: flex; align-items: center; justify-content: center;
  }
  .slot-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-empty { flex: 1; color: #aaa; font-style: italic; }
  .remove {
    background: none; border: 1px solid #d9534f; color: #d9534f;
    border-radius: 6px; padding: 3px 8px; font-size: 0.75em; cursor: pointer;
  }
  .remove:hover { background: #d9534f; color: #fff; }
  .join-form { display: flex; gap: 8px; margin-bottom: 8px; }
  .join-form input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
  .join-form button, .admin-form button, .admin-toggle button {
    background: #1f8a3b; color: #fff; border: none; border-radius: 6px;
    padding: 10px 16px; font-size: 1em; cursor: pointer;
  }
  .full { text-align: center; font-weight: 600; color: #1f8a3b; }
  .error { color: #d9534f; font-size: 0.85em; min-height: 1em; margin: 8px 0 0; }
  .admin-toggle { margin: 20px 0 8px; }
  .admin-toggle a { font-size: 0.8em; color: #888; cursor: pointer; }
  .admin-box {
    background: #f4f7f4; border: 1px solid #dbe5db; border-radius: 8px;
    padding: 12px; margin-bottom: 16px; display: none;
  }
  .admin-box.open { display: block; }
  .admin-box label { display: flex; flex-direction: column; font-size: 0.8em; gap: 4px; margin-bottom: 8px; }
  .admin-box input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
  .save-msg { font-size: 0.8em; color: #1f8a3b; margin-left: 8px; }
</style>
</head>
<body>
  <h1>Futbol 7</h1>
  <p class="subtitle">Apuntate a la lista. Solo puedes borrar tu propia inscripcion.</p>

  <div id="app"><p>Cargando...</p></div>

  <div class="admin-toggle">
    <a id="admin-link" onclick="toggleAdmin()">Soy administrador</a>
  </div>
  <div class="admin-box" id="admin-box">
    <label>Contrasena de administrador
      <input type="password" id="admin-pw">
    </label>
    <form id="admin-form">
      <label>Fecha <input type="date" id="admin-date"></label>
      <label>Hora <input type="time" id="admin-time"></label>
      <label>Notas <input type="text" id="admin-notes" maxlength="140" placeholder="Lugar, precio, etc."></label>
      <button type="submit">Guardar</button>
      <span class="save-msg" id="save-msg"></span>
    </form>
  </div>

<script>
  var POLL_MS = 5000;
  var STORAGE_KEY = 'futbol7_owned_v1';
  var ADMIN_KEY = 'futbol7_admin_pw';

  function getOwned() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function saveOwned(o) { localStorage.setItem(STORAGE_KEY, JSON.stringify(o)); }
  function rememberOwn(id, token) { var o = getOwned(); o[id] = token; saveOwned(o); }
  function forgetOwn(id) { var o = getOwned(); delete o[id]; saveOwned(o); }

  function getAdminPw() { return sessionStorage.getItem(ADMIN_KEY) || ''; }
  function setAdminPw(pw) { sessionStorage.setItem(ADMIN_KEY, pw); }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function toggleAdmin() {
    var box = document.getElementById('admin-box');
    box.classList.toggle('open');
    if (box.classList.contains('open')) {
      document.getElementById('admin-pw').value = getAdminPw();
    }
  }

  function showError(msg) {
    var el = document.getElementById('error');
    if (el) el.textContent = msg;
  }

  var lastState = null;

  function render(state) {
    lastState = state;
    var owned = getOwned();
    var adminPw = getAdminPw();
    var players = state.players;
    var html = '';

    html += '<div class="header">';
    html += '<div class="match-info">';
    html += '<span class="match-date">' + escapeHtml(state.date || 'Fecha sin definir') +
      (state.time ? ' &middot; ' + escapeHtml(state.time) : '') + '</span>';
    if (state.notes) {
      html += '<span class="notes">' + escapeHtml(state.notes) + '</span>';
    }
    html += '</div>';
    html += '<div class="count">' + players.length + ' / ' + state.max + ' apuntados</div>';
    html += '</div>';

    html += '<ul class="list">';
    for (var i = 0; i < state.max; i++) {
      var p = players[i];
      html += '<li class="slot"><span class="slot-num">' + (i + 1) + '</span>';
      if (p) {
        var canDelete = !!adminPw || Object.prototype.hasOwnProperty.call(owned, p.id);
        html += '<span class="slot-name">' + escapeHtml(p.name) + '</span>';
        if (canDelete) {
          html += '<button class="remove" data-id="' + p.id + '" onclick="removePlayer(this)">Borrar</button>';
        }
      } else {
        html += '<span class="slot-empty">Libre</span>';
      }
      html += '</li>';
    }
    html += '</ul>';

    if (players.length < state.max) {
      html += '<form class="join-form" id="join-form" onsubmit="return joinList(event)">';
      html += '<input type="text" id="join-name" maxlength="60" placeholder="Tu nombre" required>';
      html += '<button type="submit">Apuntarme</button>';
      html += '</form>';
    } else {
      html += '<p class="full">La lista esta completa.</p>';
    }

    html += '<p class="error" id="error"></p>';

    document.getElementById('app').innerHTML = html;

    var active = document.activeElement;
    var focusedId = active ? active.id : null;
    if (focusedId !== 'admin-date') document.getElementById('admin-date').value = state.date || '';
    if (focusedId !== 'admin-time') document.getElementById('admin-time').value = state.time || '';
    if (focusedId !== 'admin-notes') document.getElementById('admin-notes').value = state.notes || '';
  }

  function joinList(evt) {
    evt.preventDefault();
    var input = document.getElementById('join-name');
    var name = input.value.trim();
    if (!name) return false;
    google.script.run
      .withSuccessHandler(function (res) {
        rememberOwn(res.id, res.token);
        load();
      })
      .withFailureHandler(function (err) { showError(err.message); })
      .addPlayer(name);
    return false;
  }

  function removePlayer(btn) {
    var id = btn.getAttribute('data-id');
    var owned = getOwned();
    var token = owned[id] || '';
    var adminPw = getAdminPw();
    google.script.run
      .withSuccessHandler(function () {
        forgetOwn(id);
        load();
      })
      .withFailureHandler(function (err) { showError(err.message); })
      .deletePlayer(id, token, adminPw);
  }

  document.getElementById('admin-form').addEventListener('submit', function (evt) {
    evt.preventDefault();
    var pw = document.getElementById('admin-pw').value;
    var date = document.getElementById('admin-date').value;
    var time = document.getElementById('admin-time').value;
    var notes = document.getElementById('admin-notes').value;
    google.script.run
      .withSuccessHandler(function () {
        setAdminPw(pw);
        var msg = document.getElementById('save-msg');
        msg.textContent = 'Guardado.';
        setTimeout(function () { msg.textContent = ''; }, 2000);
        load();
      })
      .withFailureHandler(function (err) { showError(err.message); })
      .updateSettings(date, time, notes, pw);
  });

  function load() {
    var active = document.activeElement;
    var pendingJoinName = active && active.id === 'join-name' && active.value ? active.value : null;

    google.script.run
      .withSuccessHandler(function (state) {
        render(state);
        if (pendingJoinName) {
          var input = document.getElementById('join-name');
          if (input) input.value = pendingJoinName;
        }
      })
      .withFailureHandler(function (err) { showError(err.message); })
      .getState();
  }

  load();
  setInterval(load, POLL_MS);
</script>
</body>
</html>
